[package]
name = "bearai-markdown"
version = "0.1.6"
description = "BearAI Markdown desktop reader, editor, and folder browser"
authors = ["BearAI Contributors"]
license = "MIT"
repository = "https://github.com/bearaicn/bearai-markdown"
homepage = "https://github.com/bearaicn/bearai-markdown"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bearai_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[dev-dependencies]
# `test` enables Tauri's mock runtime (tauri::test) used by the menu test.
tauri = { version = "2", features = ["test"] }

# muda menu objects can only be created on the main thread, so this target opts
# out of the default (threaded) libtest harness and runs on the binary's main
# thread via `fn main()`.
[[test]]
name = "menu_window"
harness = false
